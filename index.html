<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUDOKOO - Interactive Sudoku Game</title>
    <meta name="description" content="Play interactive Sudoku puzzles online. Easy difficulty with camera scanning capability.">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Fallback font in case Google Fonts doesn't load */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
        }
    </style>
</head>
<body>
    <!-- Main Game Area -->
    <main class="main-content">
        <div class="container">
            <!-- Game Title -->
            <h1 class="game-title">SUDOKOO</h1>

            <!-- Game Controls -->
            <section class="game-controls">
                <div class="control-group">
                    <button id="new-game-btn" class="btn btn-primary">New Puzzle</button>
                    <button id="camera-btn" class="btn btn-success">
                        📸 Scan Puzzle
                    </button>
                    <input type="file" id="camera-input" accept="image/*" capture="environment" style="display: none;">
                </div>

                <div class="control-group">
                    <button id="solve-btn" class="btn btn-secondary">Show Solution</button>
                    <button id="clear-btn" class="btn btn-danger">Clear Progress</button>
                </div>

                <div class="control-group">
                    <button id="pencil-btn" class="btn btn-toggle" data-active="false">
                        <span class="pencil-icon">✏️</span>
                        Pencil Mode
                    </button>
                    <div class="timer-display">
                        <span class="timer-label">Time:</span>
                        <span id="timer" class="timer-value">--:--</span>
                    </div>
                </div>
            </section>

            <!-- Sudoku Grid -->
            <section class="game-board">
                <div id="sudoku-grid" class="sudoku-grid">
                    <!-- Grid cells will be generated by JavaScript -->
                </div>
            </section>

            <!-- Number Pad -->
            <section class="number-pad">
                <div class="number-buttons">
                    <button class="number-btn" data-number="1">1</button>
                    <button class="number-btn" data-number="2">2</button>
                    <button class="number-btn" data-number="3">3</button>
                    <button class="number-btn" data-number="4">4</button>
                    <button class="number-btn" data-number="5">5</button>
                    <button class="number-btn" data-number="6">6</button>
                    <button class="number-btn" data-number="7">7</button>
                    <button class="number-btn" data-number="8">8</button>
                    <button class="number-btn" data-number="9">9</button>
                    <button id="erase-btn" class="number-btn erase-btn">⌫</button>
                </div>
            </section>

            <!-- Game Status Messages -->
            <section class="game-status">
                <div id="status-message" class="status-message"></div>
            </section>

            <!-- Processing Modal -->
            <div id="processing-modal" class="modal hidden">
                <div class="modal-content">
                    <div class="modal-header">
                        <h2>🔍 Analyzing Image</h2>
                    </div>
                    <div class="modal-body">
                        <div class="processing-spinner"></div>
                        <p>Reading your Sudoku puzzle...</p>
                        <p><small>This may take a few seconds</small></p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Win Modal -->
    <div id="win-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h2>🎉 Congratulations!</h2>
            </div>
            <div class="modal-body">
                <p>You solved the puzzle!</p>
                <div class="win-stats">
                    <div class="win-stat">
                        <strong>Time:</strong>
                        <span id="final-time">--:--</span>
                    </div>
                    <div class="win-stat">
                        <strong>Source:</strong>
                        <span id="final-source">Generated</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="play-again-btn" class="btn btn-primary">Play Again</button>
                <button id="close-modal-btn" class="btn btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 SUDOKOO. Built with AWS by Tim for Solutions Architect Portfolio.</p>
            <p>
                <a href="https://github.com/timtimtim87/aws-project-sudoku" class="footer-link" target="_blank" rel="noopener">GitHub</a>
            </p>
        </div>
    </footer>

    <!-- JavaScript Files -->
    <script src="js/generator.js"></script>
    <script src="js/puzzles.js"></script>
    <script src="js/sudoku.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
